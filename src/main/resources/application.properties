server.port=8080

# SQLite file. In docker DB_PATH points into the /data volume.
spring.datasource.url=jdbc:sqlite:${DB_PATH:cfp.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
# sqlite doesn't like concurrent writers, so one connection only
spring.datasource.hikari.maximum-pool-size=1
spring.sql.init.mode=always

management.endpoints.web.exposure.include=health,info

# Kept from the 2019 setup, the mobile client depends on some of these
server.error.include-message=always
server.error.include-binding-errors=always
server.servlet.encoding.force=true
spring.jackson.parser.allow-comments=true

#logging.level.org.springframework.jdbc.core=DEBUG
