name: Build & Deploy to Scaleway

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Login to Scaleway Container Registry
      uses: docker/login-action@v3
      with:
        username: nologin
        password: "${{ secrets.SCW_SECRET_KEY }}"
        registry: "${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}"
    - name: Build the Docker image
      run: docker build . -t ${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}/fagsem-h2026:latest
    - name: Push the Docker Image
      run: docker push ${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}/fagsem-h2026:latest

    - name: Configure Scaleway CLI
      uses: scaleway/action-scw@v0
      with:
        save-config: true
        export-config: true
        version: v2.65.2
        access-key: ${{ secrets.SCW_ACCESS_KEY }}
        secret-key: ${{ secrets.SCW_SECRET_KEY }}
        default-project-id: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
        default-organization-id: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}

    - name: Use CLI
      uses: scaleway/action-scw@v0
      id: cli
      with:
        args: container container list name=fagsem-h2026-01 region=fr-par

    - run: echo ${{ steps.cli.outputs.json }}
