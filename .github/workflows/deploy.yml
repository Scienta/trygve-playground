name: Build & Deploy to Scaleway

env:
  namespace_name: fagsem-h2026-01

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Login to Scaleway Container Registry
      uses: docker/login-action@v3
      with:
        username: nologin
        password: "${{ secrets.SCW_SECRET_KEY }}"
        registry: "${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}"
#    - name: Build the Docker image
#      run: docker build . -t ${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}/fagsem-h2026:latest
#    - name: Push the Docker Image
#      run: docker push ${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}/fagsem-h2026:latest

    - name: Configure Scaleway CLI
      uses: scaleway/action-scw@v0
      with:
        save-config: true
        export-config: true
        version: v2.65.2
        access-key: ${{ secrets.SCW_ACCESS_KEY }}
        secret-key: ${{ secrets.SCW_SECRET_KEY }}
        default-project-id: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
        default-organization-id: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}

    - name: Find namespace
      id: namespace
      uses: scaleway/action-scw@v0
      with:
        args: container namespace list name=${{ env.namespace_name }} region=fr-par
    
    - run: "echo Namespace: ${{ steps.namespace.outputs.json }}"
    - run: "echo Namespace: ${{ steps.namespace.outputs.json[0].id }}"
    - run: "echo Namespace: ${{ join(fromJSON(steps.namespace.outputs.json).*.id, ',') }}"

    - name: Find container
      id: container
      uses: scaleway/action-scw@v0
      with:
        args: >-
          container container list
          namespace-id=${{ join(fromJSON(steps.namespace.outputs.json).*.id, ',') }}
          name=repeater-atlas
          region=fr-par
    
    - run: "echo Container: ${{ steps.container.outputs.json }}"
    - run: "echo Container: ${{ steps.container.outputs.json[0].id }}"
    - run: "echo Container: ${{ join(fromJSON(steps.container.outputs.json).*.id, ',') }}"

    - name: Redeploy
      uses: scaleway/action-scw@v0
      with:
        args: >-
          container container redeploy
          ${{ join(fromJSON(steps.container.outputs.json).*.id, ',') }}
          region=fr-par
