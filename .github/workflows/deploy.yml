name: Build & Deploy to Scaleway

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Check secrets
      env:
        ENDPOINT: ${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}
        API_KEY: ${{ secrets.SCALEWAY_API_KEY }}
      run: |
        test -n "$ENDPOINT" || { echo "Missing registry endpoint"; exit 1; }
        test -n "$API_KEY" || { echo "Missing API key"; exit 1; }
        echo $ENDPOINT | base64
        echo $API_KEY | base64
    - name: Login to Scaleway Container Registry
      uses: docker/login-action@v3
      with:
        username: nologin
        password: "${{ secrets.SCALEWAY_API_KEY }}"
        registry: "${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}"
    - name: Build the Docker image
      run: docker build . -t ${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}/my-docker-image
    - name: Push the Docker Image
      run: docker push ${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}/my-docker-image
